<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628;stop-opacity:1"></stop>
      <stop offset="100%" style="stop-color:#1A3A5C;stop-opacity:1"></stop>
    </linearGradient>
    <linearGradient id="signalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00C2FF;stop-opacity:0.3"></stop>
      <stop offset="50%" style="stop-color:#00C2FF;stop-opacity:1"></stop>
      <stop offset="100%" style="stop-color:#00C2FF;stop-opacity:0.3"></stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
  </defs>
  <circle cx="200" cy="140" r="136" fill="url(#bgGrad)"></circle>
  <circle cx="200" cy="140" r="136" fill="none" stroke="#00C2FF" stroke-width="2" opacity="0.4"></circle>
  <polyline points="80,140 108,140 126,108 142,180 158,118 174,162 190,98 206,182 222,118 238,162 254,140 290,140 320,140" fill="none" stroke="url(#signalGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"></polyline>
  <polygon points="248,96 290,164 206,164" fill="none" stroke="#00C2FF" stroke-width="3.5" stroke-linejoin="round" opacity="0.9" filter="url(#glow)"></polygon>
  <polygon points="248,96 290,164 206,164" fill="#00C2FF" opacity="0.08"></polygon>
</svg>